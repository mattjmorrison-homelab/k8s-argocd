apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-oci
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: argocd-repo-creds-oci-openbao
    kind: SecretStore
  target:
    name: argocd-repo-creds-oci
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: helm
        enableOCI: "true"
        url: registry.morrisons.site/charts
        username: ci
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: homelab/argocd
        property: ZOT_CI_PASSWORD
